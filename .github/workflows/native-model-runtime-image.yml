name: Publish experimental native model runtime image

on:
  push:
    branches: [codex/native-model-runtime]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: native-model-runtime-image
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'power12317/codex-server' && github.ref == 'refs/heads/codex/native-model-runtime'
    name: Runtime (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate official release version
        run: |
          set -euo pipefail
          version="$(cat deploy/cpa-runtime/release-version)"
          [[ "$version" =~ ^0\.[1-9][0-9]*\.[0-9]+$ ]]
          python3 deploy/cpa-runtime/test_prepare_release.py
      - name: Make room for the Rust build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the Codex Server image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/cpa-runtime/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            FORK_REVISION=${{ github.sha }}
          outputs: type=image,name=ghcr.io/power12317/codex-server-native-runtime,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=native-model-runtime-${{ matrix.arch }}
          cache-to: type=gha,scope=native-model-runtime-${{ matrix.arch }},mode=max
      - name: Verify the published runtime starts
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpa-auth"
          printf '%s\n' '{"type":"codex","codex_cli":{"enabled":false}}' > "$RUNNER_TEMP/cpa-auth/worker.json"
          chmod 755 "$RUNNER_TEMP/cpa-auth"
          chmod 644 "$RUNNER_TEMP/cpa-auth/worker.json"
          trap 'docker logs cpa-runtime-smoke; docker rm -f cpa-runtime-smoke' EXIT
          docker run -d --name cpa-runtime-smoke --network host \
            -v "$RUNNER_TEMP/cpa-auth:/cpa-auth:ro" \
            "ghcr.io/power12317/codex-server-native-runtime@${IMAGE_DIGEST}"
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:38317/readyz; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify host timezone mounts
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: deploy/cpa-runtime/check-timezone.sh "ghcr.io/power12317/codex-server-native-runtime@${IMAGE_DIGEST}"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
      - name: Verify the published worker sends official client identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node deploy/cpa-runtime/check-identity.mjs "ghcr.io/power12317/codex-server-native-runtime@${IMAGE_DIGEST}"
      - name: Export the verified image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "### Codex Server image"
            echo "Source: ${SOURCE_REVISION}; architecture: ${IMAGE_ARCH}"
            echo "Digest: ${IMAGE_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"
          echo "::notice title=Published Codex Server image::ghcr.io/power12317/codex-server-native-runtime@${IMAGE_DIGEST}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-model-runtime-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multiarch manifest
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: native-model-runtime-digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the verified native images
        env:
          IMAGE_NAME: ghcr.io/power12317/codex-server-native-runtime
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("$RUNNER_TEMP"/digests/*)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "Expected verified digests for both amd64 and arm64" >&2
            exit 1
          fi
          sources=()
          for file in "${digest_files[@]}"; do
            digest="${file##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done
          tags=(--tag "${IMAGE_NAME}:latest" --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}")
          docker buildx imagetools create \
            "${tags[@]}" \
            "${sources[@]}"
          echo '### Published multiarch Codex Server' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE_NAME}:latest" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
